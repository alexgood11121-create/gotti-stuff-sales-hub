<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Gotti Stuff</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0b0f14; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
      .wrap { display: flex; height: 100%; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; animation: p 1s infinite; }
      @keyframes p { 0%,100%{opacity:.3} 50%{opacity:1} }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="dot"></div>
      <div>Gotti Stuff</div>
    </div>
    <script>
      location.replace("https://gotti-stuff-sales-hub.lovable.app/");
    </script>
  </body>
</html>
