name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build web bundle
        run: bun run build

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/gotti-stuff-${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk out/gotti-stuff-latest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gotti-stuff-apk
          path: out/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gotti Stuff build ${{ github.run_number }}
          files: out/*.apk
          generate_release_notes: false
