name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Show build environment
        run: |
          node --version
          npm --version
          java -version
          sdkmanager --list_installed | grep -E "platforms;android-36|build-tools;36.0.0|platform-tools" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install Capacitor build tools
        run: |
          mkdir -p .capacitor-tools
          cat > .capacitor-tools/package.json <<'JSON'
          {
            "private": true,
            "type": "module",
            "dependencies": {
              "@capacitor/android": "8.4.2",
              "@capacitor/cli": "8.4.2",
              "@capacitor/core": "8.4.2"
            }
          }
          JSON
          npm --prefix .capacitor-tools install --omit=dev --no-audit --no-fund --registry=https://registry.npmjs.org
          rm -rf node_modules
          ln -s .capacitor-tools/node_modules node_modules
          ./.capacitor-tools/node_modules/.bin/cap --version

      - name: Ensure www/ exists
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            echo "www/index.html missing" && exit 1
          fi

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            ./.capacitor-tools/node_modules/.bin/cap add android
          fi

      - name: Sync Capacitor
        run: ./.capacitor-tools/node_modules/.bin/cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/gotti-stuff-${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/gotti-stuff-latest.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gotti-stuff-apk
          path: out/*.apk

      - name: Publish "latest" release (stable link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Gotti Stuff (latest)
          files: out/gotti-stuff-latest.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
          prerelease: false

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gotti Stuff build ${{ github.run_number }}
          files: out/gotti-stuff-${{ github.run_number }}.apk
          fail_on_unmatched_files: true
          prerelease: false

