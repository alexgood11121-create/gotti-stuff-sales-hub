name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Capacitor Android library
        run: |
          mkdir -p node_modules
          npm install --no-save --no-package-lock --prefix . \
            @capacitor/android@8.4.2 \
            @capacitor/core@8.4.2 \
            --registry=https://registry.npmjs.org
          test -d node_modules/@capacitor/android/capacitor || (echo "capacitor-android missing" && exit 1)

      - name: Show build environment
        run: |
          node --version
          java -version
          ls node_modules/@capacitor || true
          sdkmanager --list_installed | grep -E "platforms;android-36|build-tools;36.0.0|platform-tools" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Refresh web assets
        run: |
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -R www/. android/app/src/main/assets/public/

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/gotti-stuff-${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/gotti-stuff-latest.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gotti-stuff-apk
          path: out/*.apk

      - name: Publish "latest" release (stable link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Gotti Stuff (latest)
          files: out/gotti-stuff-latest.apk
          fail_on_unmatched_files: true
          make_latest: true
          prerelease: false

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gotti Stuff build ${{ github.run_number }}
          files: out/gotti-stuff-${{ github.run_number }}.apk
          fail_on_unmatched_files: true
          prerelease: false
