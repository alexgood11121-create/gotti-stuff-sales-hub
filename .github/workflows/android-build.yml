name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Capacitor Android library
        run: |
          mkdir -p node_modules
          npm install --no-save --no-package-lock --prefix . \
            @capacitor/android@8.4.2 \
            @capacitor/core@8.4.2 \
            --registry=https://registry.npmjs.org
          test -d node_modules/@capacitor/android/capacitor || (echo "capacitor-android missing" && exit 1)

      - name: Show build environment
        run: |
          node --version
          java -version
          ls node_modules/@capacitor || true
          sdkmanager --list_installed | grep -E "platforms;android-36|build-tools;36.0.0|platform-tools" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install project dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build offline SPA bundle for Capacitor
        run: npm run build:capacitor
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://nmgrzomlrkuzknturedq.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_QTgjWin2WA5WqDSZr0vRtQ_2yHXrSmR' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'nmgrzomlrkuzknturedq' }}

      - name: Refresh web assets
        run: |
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -R www/. android/app/src/main/assets/public/
          ls -la android/app/src/main/assets/public/ | head -20

      - name: Generate capacitor-cordova-android-plugins stub
        run: |
          PLUGIN_DIR="android/capacitor-cordova-android-plugins"
          mkdir -p "$PLUGIN_DIR/src/main/libs"
          cat > "$PLUGIN_DIR/build.gradle" <<'EOF'
          apply plugin: 'com.android.library'

          android {
              namespace "capacitor.cordova.android.plugins"
              compileSdk rootProject.ext.compileSdkVersion
              defaultConfig {
                  minSdkVersion rootProject.ext.minSdkVersion
                  targetSdkVersion rootProject.ext.targetSdkVersion
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
              lintOptions { abortOnError false }
          }

          repositories {
              google()
              mavenCentral()
              flatDir { dirs 'src/main/libs', 'libs' }
          }

          dependencies {
              implementation fileTree(dir: 'src/main/libs', include: ['*.jar'])
              implementation project(':capacitor-android')
          }
          EOF
          cat > "$PLUGIN_DIR/cordova.variables.gradle" <<'EOF'
          ext {
              cdvMinSdkVersion = rootProject.ext.minSdkVersion
          }
          EOF
          cat > "$PLUGIN_DIR/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" />
          EOF
          ls -la "$PLUGIN_DIR"


      - name: Restore signing keystore from secrets (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No keystore secret set — using repo keystore android/keystore/gotti-release.jks"
            exit 0
          fi
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/keystore/ci-release.jks
          {
            echo "ANDROID_KEYSTORE_PATH=$PWD/android/keystore/ci-release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"


      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK" || (echo "release APK not found" && exit 1)
          cp "$APK" "out/gotti-stuff-${{ github.run_number }}.apk"
          cp "$APK" "out/gotti-stuff-latest.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gotti-stuff-apk
          path: out/*.apk

      - name: Publish "latest" release (stable link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Gotti Stuff (latest)
          files: out/gotti-stuff-latest.apk
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
          prerelease: false

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gotti Stuff build ${{ github.run_number }}
          files: out/gotti-stuff-${{ github.run_number }}.apk
          fail_on_unmatched_files: true
          prerelease: false

